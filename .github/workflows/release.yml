name: Publish plugins
on:
  push:
    tags: ['plugins-release-*']
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to publish
        required: true
        default: all
        type: choice
        options: [all, agent-browser, officecli, x, google-workspace, gemini-api]
permissions:
  contents: write
concurrency:
  group: plugin-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Prepare original upstream Skills
        run: bash scripts/prepare-upstream.sh
      - name: Pack plugin releases
        run: node scripts/catalog.mjs pack '${{ inputs.plugin || 'all' }}' out
      - name: Publish complete releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs '${{ inputs.plugin || 'all' }}' out
      - name: Update the public catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(catalog): publish reviewed plugin releases"
            git push origin HEAD:main
          fi
